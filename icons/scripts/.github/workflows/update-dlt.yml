name: Update Super Lotto Data

on:
  schedule:
    # 每周一、周三、周六，北京时间22:40运行
    - cron: "40 14 * * 1,3,6"

  # 允许手动启动
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update lottery data
        run: |
          python scripts/update_dlt.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dlt-history.json
          if git diff --cached --quiet; then
            echo "No new lottery data."
          else
            git commit -m "Update lottery history"
            git push
          fi
