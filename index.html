<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1b38">
<meta name="description" content="大乐透随机选号器，仅供娱乐，不构成投注建议。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>大乐透随机选号器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#0f1117;color:#e8eaed;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
.app{width:100%;max-width:420px}
h1{font-size:20px;font-weight:600;text-align:center;letter-spacing:1px;margin-bottom:6px}
.sub{text-align:center;font-size:12px;color:#8a8f99;margin-bottom:22px;line-height:1.6}
.card{background:#1a1d26;border-radius:18px;padding:20px 16px;margin-bottom:16px}
.ticket{margin-bottom:18px}.ticket:last-child{margin-bottom:0}
.ticket-label{font-size:11px;color:#6b7280;margin-bottom:8px;letter-spacing:.5px}
.balls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ball{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.ball.red{background:#c0392b;color:#fff;box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.ball.blue{background:#2471a3;color:#fff;box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.divider{width:1px;height:28px;background:#2d3340;margin:0 4px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s;letter-spacing:.5px}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:#e8eaed;color:#0f1117}
.btn-secondary{background:#2d3340;color:#e8eaed}
.options{display:flex;gap:10px;margin-bottom:16px}
.opt{flex:1;background:#1a1d26;border:1px solid #2d3340;border-radius:12px;padding:12px 8px;text-align:center;font-size:13px;color:#9aa0a8;cursor:pointer;transition:all .15s}
.opt.active{border-color:#e8eaed;color:#e8eaed;background:#222630}
.disclaimer{font-size:11px;color:#5c6370;text-align:center;line-height:1.8;margin-top:8px;padding:0 8px}
.footer{font-size:10px;color:#3d424d;text-align:center;margin-top:24px;line-height:1.8}
</style>
</head>
<body>
<div class="app">
<h1>大乐透 · 随机选号器</h1>
<p class="sub">前区 1–35 选 5 个 · 后区 1–12 选 2 个<br>仅供娱乐，不构成任何投注建议</p>
<div class="options">
<div class="opt active" data-mode="balanced">平衡随机</div>
<div class="opt" data-mode="pure">纯随机</div>
</div>
<div class="card" id="output"></div>
<div class="actions">
<button class="btn btn-primary" id="btn-generate">生成一注</button>
<button class="btn btn-secondary" id="btn-generate5">生成 5 注</button>
</div>
<p class="disclaimer">彩票开奖号码为独立随机事件，每一注的中奖概率完全相同。<br>本工具仅提供随机号码组合，不具任何预测能力。</p>
<p class="footer">请理性购彩 · 未成年人不得购买彩票</p>
</div>
<script>
(function(){
const FRONT_MAX=35,BACK_MAX=12,FRONT_COUNT=5,BACK_COUNT=2;
function pickUnique(poolSize,count){
 const pool=Array.from({length:poolSize},(_,i)=>i+1);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 return pool.slice(0,count).sort((a,b)=>a-b);
}
function isBalanced(front){
 const odd=front.filter(n=>n%2===1).length;if(odd<2||odd>3)return false;
 const big=front.filter(n=>n>=18).length;if(big<2||big>3)return false;
 let consecutive=0;for(let i=1;i<front.length;i++){if(front[i]-front[i-1]===1)consecutive++;}
 if(consecutive>1)return false;
 const zones=new Set();front.forEach(n=>zones.add(Math.floor((n-1)/7)));
 if(zones.size>=5)return false;return true;
}
function generateFront(mode){
 for(let attempt=0;attempt<500;attempt++){const front=pickUnique(FRONT_MAX,FRONT_COUNT);if(mode==='pure'||isBalanced(front))return front;}
 return pickUnique(FRONT_MAX,FRONT_COUNT);
}
const output=document.getElementById('output');let currentMode='balanced';
function render(tickets){
 if(!tickets.length){output.innerHTML='<p style="text-align:center;color:#5c6370;padding:28px 0;font-size:13px">点击下方按钮生成号码</p>';return;}
 output.innerHTML=tickets.map((t,i)=>`<div class="ticket">${tickets.length>1?`<div class="ticket-label">第 ${i+1} 注</div>`:''}<div class="balls">${t.front.map(n=>`<span class="ball red">${String(n).padStart(2,'0')}</span>`).join('')}<span class="divider"></span>${t.back.map(n=>`<span class="ball blue">${String(n).padStart(2,'0')}</span>`).join('')}</div></div>`).join('');
}
function generate(n){const tickets=[];for(let i=0;i<n;i++)tickets.push({front:generateFront(currentMode),back:pickUnique(BACK_MAX,BACK_COUNT)});render(tickets);}
document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',function(){document.querySelectorAll('.opt').forEach(o=>o.classList.remove('active'));this.classList.add('active');currentMode=this.dataset.mode;}));
document.getElementById('btn-generate').addEventListener('click',()=>generate(1));
document.getElementById('btn-generate5').addEventListener('click',()=>generate(5));
generate(1);
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.log('SW注册失败',err)));}
</script>
</body>
</html>
